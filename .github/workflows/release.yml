name: Release

# Tag a commit to cut a release:
#   git tag v2.3.0 && git push origin v2.3.0
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-latest

    steps:
      - uses: actions/checkout@v4

      - name: Check tag matches Info.plist version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          tag="${GITHUB_REF_NAME#v}"
          plist=$(/usr/libexec/PlistBuddy -c "Print CFBundleShortVersionString" BeardieMusic/BeardieMusic-Info.plist)
          if [ "$tag" != "$plist" ]; then
            echo "Tag $GITHUB_REF_NAME does not match CFBundleShortVersionString $plist" >&2
            exit 1
          fi

      - name: Install pods
        run: pod install

      # Unsigned: no Developer ID certificate is available in CI, so Gatekeeper
      # will warn on first launch. See README for signing this locally.
      - name: Build and package
        run: ./release.sh CODE_SIGNING_ALLOWED=NO

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" --generate-notes ./*.dmg

      - uses: actions/upload-artifact@v4
        with:
          name: BeardieMusic-dmg
          path: ./*.dmg
