os: osx
osx_image: xcode8
language: objective-c
rvm:
  - 2.3.1
before_install:
  - gem install cocoapods
  - gem install xcpretty -N --no-ri --no-rdoc

script:
  - set -o pipefail
  - xcodebuild clean test -workspace Beardie.xcworkspace -scheme Beardie -sdk macosx -enableCodeCoverage YES | xcpretty

